<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f97316" />
    <title>Offline · Finish Line</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 0.5rem;
        text-align: center;
        padding: 2rem;
        background: #09090b;
        color: #fafafa;
        font: 400 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 1.25rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
      p { margin: 0; color: #a1a1aa; }
      .mark { color: #f97316; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.7rem; }
    </style>
  </head>
  <body>
    <p class="mark">Finish Line</p>
    <h1>You're offline</h1>
    <p>The scores need a connection to be true. Reconnect and reload.</p>
  </body>
</html>
